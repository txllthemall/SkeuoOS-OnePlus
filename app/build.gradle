plugins { id 'com.android.application' }

android {
    namespace 'io.github.txllthemall.skeuoos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.txllthemall.skeuoos'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '4.1.0'
    }

    flavorDimensions += 'appearance'
    productFlavors {
        color {
            dimension 'appearance'
            // Keep the original package id so the color build upgrades the existing pack.
        }
        clear {
            dimension 'appearance'
            // Separate package id so Color and Clear can be installed side by side.
            applicationIdSuffix '.clear'
            versionNameSuffix '-clear'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

// Both variants share geometry. v4.1 gives Clear a spatially varying optical material
// with local reflections, non-uniform density and stronger transparent regions.
tasks.register('generateLiquid27Icons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/generate_liquid27_v41.py', '--variant', 'all'
}
