plugins { id 'com.android.application' }

android {
    namespace 'io.github.txllthemall.skeuoos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.txllthemall.skeuoos'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// Icon preparation is explicit in CI/local build instructions:
//   python3 tools/generate_icons.py
//   python3 tools/import_zagnut_ios6.py
// Keeping it outside preBuild prevents the generated fallback artwork from
// overwriting the real upstream iOS 6 overlays immediately before packaging.
tasks.register('generateSkeuoIcons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/generate_icons.py'
}
