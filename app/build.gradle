plugins { id 'com.android.application' }

android {
    namespace 'io.github.txllthemall.skeuoos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.txllthemall.skeuoos'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '3.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// v3 artwork is generated locally from original vector-like geometry and
// Liquid Glass material simulation. No upstream Apple icon files are bundled.
tasks.register('generateLiquid27Icons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/generate_liquid27.py'
}
