plugins { id 'com.android.application' }

android {
    namespace 'io.github.txllthemall.skeuoos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.txllthemall.skeuoos'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}


tasks.register('generateSkeuoIcons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/generate_icons.py'
}

preBuild.dependsOn generateSkeuoIcons
