plugins { id 'com.android.application' }

android {
    namespace 'io.github.txllthemall.skeuoos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.txllthemall.skeuoos'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '4.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// v4 uses original vector-like geometry plus a layer-based static Liquid Glass renderer.
// No Apple raster assets or v2 iOS 6 artwork are bundled or downloaded.
tasks.register('generateLiquid27Icons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/generate_liquid27.py'
}
