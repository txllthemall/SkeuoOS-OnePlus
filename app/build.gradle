plugins { id 'com.android.application' }

android {
    namespace 'io.github.txllthemall.skeuoos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.txllthemall.skeuoos'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '4.0.0'
    }

    flavorDimensions += 'appearance'
    productFlavors {
        color {
            dimension 'appearance'
            // Keep the original package id so the color build upgrades the existing pack.
        }
        clear {
            dimension 'appearance'
            // Separate package id so Color and Clear can be installed side by side.
            applicationIdSuffix '.clear'
            versionNameSuffix '-clear'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

// Both variants are generated from one vector/material codebase.  The Color flavor
// keeps brand color while Clear bakes a low-chroma, partially transparent glass preset.
tasks.register('generateLiquid27Icons', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/generate_liquid27.py', '--variant', 'all'
}
