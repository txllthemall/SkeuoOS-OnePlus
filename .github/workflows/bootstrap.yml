name: Bootstrap SkeuoOS source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expand prepared source tree
        shell: bash
        run: |
          cat > /tmp/skeuoos-src.b64 <<'SKEUOOS_EOF'

SKEUOOS_EOF
          base64 -d /tmp/skeuoos-src.b64 | tar -xzf -
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SkeuoOS OnePlus source"
          git push
