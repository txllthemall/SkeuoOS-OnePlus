name: Liquid Glass V3/V4/V5/V6 Master

on:
  push:
    branches: [ v4.1-clear-glass ]
    paths:
      - 'tools/liquid_glass_v3/**'
      - 'tools/liquid_glass_v4/**'
      - 'tools/liquid_glass_v5/**'
      - 'tools/liquid_glass_v6/**'
      - '.github/workflows/liquid-glass-v3.yml'
  workflow_dispatch:

concurrency:
  group: liquid-glass-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Render V3 baseline master
        run: python3 tools/liquid_glass_v3/render_master.py
      - name: Render V4 analytic-volume master
        run: python3 tools/liquid_glass_v4/render_master.py
      - name: Render V5 transport-derived master
        run: python3 tools/liquid_glass_v5/render_master.py
      - name: Render V6 signed dual-polarity master
        run: python3 tools/liquid_glass_v6/render_master.py
      - name: Upload V3 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Liquid-Glass-V3-Master
          path: build/liquid-glass-v3/**
          if-no-files-found: error
      - name: Upload V4 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Liquid-Glass-V4-Master
          path: build/liquid-glass-v4/**
          if-no-files-found: error
      - name: Upload V5 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Liquid-Glass-V5-Master
          path: build/liquid-glass-v5/**
          if-no-files-found: error
      - name: Upload V6 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Liquid-Glass-V6-Master
          path: build/liquid-glass-v6/**
          if-no-files-found: error
