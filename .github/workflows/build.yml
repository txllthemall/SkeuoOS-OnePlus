name: Android CI

on:
  push:
    branches: [ main, master, v4-liquid27, v4.1-clear-glass ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Generate Color and Clear Liquid27 resources
        run: python3 tools/generate_liquid27_release.py --variant all
      - name: Sync OxygenOS icon-pack metadata
        run: |
          cp app/src/main/res/xml/appfilter.xml app/src/main/assets/appfilter.xml
          cp app/src/main/res/xml/drawable.xml app/src/main/assets/drawable.xml
      - name: Liquid27 visual and geometry QA
        run: python3 tools/qa_liquid27.py --variant all
      - name: Verify both packs
        run: python3 tools/check_pack.py
      - name: Build both APKs
        run: gradle --no-daemon :app:assembleColorDebug :app:assembleClearDebug
      - name: Upload APKs and previews
        uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Liquid27-v4.1.0-dual
          path: |
            app/build/outputs/apk/color/debug/app-color-debug.apk
            app/build/outputs/apk/clear/debug/app-clear-debug.apk
            build/liquid27-v4/color/preview_geometry_focus.png
            build/liquid27-v4/color/preview_vector_reference.png
            build/liquid27-v4/color/preview_full.png
            build/liquid27-v4/color/preview_home.png
            build/liquid27-v4/color/preview_wallpaper.png
            build/liquid27-v4/color/qa.tsv
            build/liquid27-v4/clear/preview_geometry_focus.png
            build/liquid27-v4/clear/preview_vector_reference.png
            build/liquid27-v4/clear/preview_full.png
            build/liquid27-v4/clear/preview_home.png
            build/liquid27-v4/clear/preview_wallpaper.png
            build/liquid27-v4/clear/qa.tsv
            DESIGN_NOTES.md
          if-no-files-found: error
