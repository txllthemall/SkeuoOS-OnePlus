name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate Liquid27 icons
        run: python3 tools/generate_liquid27.py
      - name: Verify pack
        run: python3 tools/check_pack.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK and preview
        uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-OnePlus-v3.0.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/liquid27-preview.png
          if-no-files-found: error
