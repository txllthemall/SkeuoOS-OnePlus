name: Release APK

on:
  push:
    branches: [ main ]
    paths: [ '.release-v3.0.0' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate Liquid27 icons
        run: python3 tools/generate_liquid27.py
      - name: Verify pack
        run: python3 tools/check_pack.py
      - run: gradle --no-daemon :app:assembleDebug
      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SkeuoOS-OnePlus-v3.0.0.apk
          cp build/liquid27-preview.png SkeuoOS-Liquid27-v3-preview.png
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: SkeuoOS Liquid27 v3.0.0
          body: |
            Full visual rebuild around the iOS 27 Liquid Glass design language.

            - 66 original icons regenerated from scratch
            - 152 Android component mappings retained
            - sharper layered glass instead of the old iOS 6 artwork
            - restrained translucency for stronger legibility
            - separate material layers with simulated refraction
            - fixed top/bottom specular highlights rather than motion shimmer
            - simplified, optically balanced glyph geometry
            - 768 px working render downsampled to 512 px for cleaner edges
            - no zagnut/iOS-6-Icons assets are bundled in v3

            This is an original Android icon pack inspired by Apple's current Liquid Glass design principles. It is not an extraction of Apple's iOS 27 icon assets and is not affiliated with Apple.
          files: |
            SkeuoOS-OnePlus-v3.0.0.apk
            SkeuoOS-Liquid27-v3-preview.png
