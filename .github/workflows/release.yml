name: Release APK

on:
  push:
    branches: [ main ]
    paths: [ '.release-v0.1.0' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python3 tools/generate_icons.py
      - run: python3 tools/check_pack.py
      - run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SkeuoOS-OnePlus-v0.1.0.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: SkeuoOS OnePlus v0.1.0
          body: |
            First public build of SkeuoOS OnePlus.

            - Skeuomorphic icon pack for OnePlus / OxygenOS
            - 66 icons
            - 152 Android component mappings
            - APK built automatically by GitHub Actions
          files: SkeuoOS-OnePlus-v0.1.0.apk
