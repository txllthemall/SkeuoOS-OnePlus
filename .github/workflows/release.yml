name: Release APK

on:
  push:
    branches: [ main ]
    paths: [ '.release-v4.0.0' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Generate Liquid27 v4 icons
        run: python3 tools/generate_liquid27.py
      - name: Visual QA
        run: python3 tools/qa_liquid27.py
      - name: Verify pack
        run: python3 tools/check_pack.py
      - run: gradle --no-daemon :app:assembleDebug
      - name: Rename release artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SkeuoOS-OnePlus-v4.0.0.apk
          cp build/liquid27-v4/preview_full.png SkeuoOS-Liquid27-v4-full-preview.png
          cp build/liquid27-v4/preview_home.png SkeuoOS-Liquid27-v4-home-preview.png
          cp DESIGN_NOTES.md SkeuoOS-Liquid27-v4-DESIGN_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: SkeuoOS Liquid27 v4.0.0
          body: |
            Clean-room static Android interpretation of Apple's iOS 27 app-icon material system.

            - layer-based rendering instead of v3's shared pseudo-skeuomorphic shell
            - actual under-layer sampling for static refraction
            - stronger edge refraction and crisp vertical-light specular highlights
            - restrained translucency and shadows for launcher-scale legibility
            - curated v4 geometry for the most visible system and third-party apps
            - 152 existing Android component mappings retained
            - no iOS 6 / zagnut artwork or importer in the v4 build
            - full contact sheet, OnePlus-scale preview and design notes included

            The native Apple renderer is dynamic; this pack is a static PNG approximation for OxygenOS. It does not contain extracted Apple icon assets and is not affiliated with Apple.
          files: |
            SkeuoOS-OnePlus-v4.0.0.apk
            SkeuoOS-Liquid27-v4-full-preview.png
            SkeuoOS-Liquid27-v4-home-preview.png
            SkeuoOS-Liquid27-v4-DESIGN_NOTES.md
