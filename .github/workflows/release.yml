name: Release APK

on:
  push:
    branches: [ main ]
    paths: [ '.release-v0.2.0' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate SkeuoOS fallback icons
        run: python3 tools/generate_icons.py
      - name: Import complete zagnut iOS 6 collection
        run: python3 tools/import_zagnut_ios6.py
      - name: Verify pack
        run: python3 tools/check_pack.py
      - run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SkeuoOS-OnePlus-v0.2.0.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: SkeuoOS OnePlus v0.2.0
          body: |
            Full iOS 6 collection build for OnePlus / OxygenOS.

            - 591 packaged icon resources
            - 525 upstream icons imported from zagnut531/iOS-6-Icons
            - 66 SkeuoOS fallback icons
            - 152 Android component mappings
            - 35 common mappings automatically use matching upstream artwork
            - full upstream collection available in the manual icon picker
            - truncated upstream PNGs recovered during CI

            Upstream artwork source:
            https://github.com/zagnut531/iOS-6-Icons

            The upstream repository does not provide a standard content license. Imported Apple and third-party artwork is not covered by SkeuoOS's MIT license and remains the property of its respective owners/creators.
          files: SkeuoOS-OnePlus-v0.2.0.apk
