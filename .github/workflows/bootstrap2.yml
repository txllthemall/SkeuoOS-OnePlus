name: Bootstrap SkeuoOS source v2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Recover packed source and import it
        shell: bash
        run: |
          awk '/^H4sIA/{flag=1} /^SKEUOOS_EOF$/{flag=0} flag' .github/workflows/bootstrap.yml > /tmp/skeuoos-src.b64
          set +o pipefail
          base64 -d /tmp/skeuoos-src.b64 | tar -xzf - || true
          set -o pipefail
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f tools/generate_icons.py
          rm -f .github/workflows/bootstrap.yml .github/workflows/bootstrap2.yml .bootstrap-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SkeuoOS OnePlus source"
          git push
