name: Clear v4.1 Preview

on:
  push:
    branches: [ v4.1-clear-glass ]
    paths:
      - 'tools/liquid27/**'
      - 'tools/generate_liquid27.py'
      - 'tools/qa_liquid27.py'
      - '.github/workflows/clear-preview.yml'
  workflow_dispatch:

concurrency:
  group: clear-v41-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Render canonical Clear representative set
        run: python3 tools/generate_liquid27.py --variant clear --quick
      - uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Clear-v4.1-quick-preview
          path: |
            build/liquid27-v4/clear/preview_geometry_focus.png
            build/liquid27-v4/clear/preview_clear_wallpaper.png
            build/liquid27-v4/clear/preview_home_clear.png
            build/liquid27-v4/clear/preview_clear_flat.png
            build/liquid27-v4/clear/qa.tsv
          if-no-files-found: warn
