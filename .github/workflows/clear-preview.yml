name: Clear v4.1 Preview

on:
  push:
    branches: [ v4.1-clear-glass ]
    paths:
      - 'tools/liquid27/**'
      - 'tools/generate_liquid27.py'
      - 'tools/generate_clear_validation_previews.py'
      - 'tools/qa_liquid27.py'
      - 'tools/qa_clear_neutral.py'
      - '.github/workflows/clear-preview.yml'
  workflow_dispatch:

concurrency:
  group: clear-v41-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Render canonical Clear representative set
        run: |
          python3 tools/generate_liquid27.py --variant clear --quick
          cp build/liquid27-v4/clear/preview_clear_light.png build/liquid27-v4/clear/preview_clear_flat.png
      - name: Render Clear optical and Android validation set
        run: python3 tools/generate_clear_validation_previews.py
      - name: Check Clear neutral color bias
        run: python3 tools/qa_clear_neutral.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Clear-v4.1-quick-preview
          path: |
            build/liquid27-v4/clear/preview_geometry_focus.png
            build/liquid27-v4/clear/preview_clear_wallpaper.png
            build/liquid27-v4/clear/preview_home_clear.png
            build/liquid27-v4/clear/preview_clear_flat.png
            build/liquid27-v4/clear/preview_color_wallpaper.png
            build/liquid27-v4/clear/preview_home_color.png
            build/liquid27-v4/clear/preview_neutral_wallpaper.png
            build/liquid27-v4/clear/preview_warm_wallpaper.png
            build/liquid27-v4/clear/preview_blue_wallpaper.png
            build/liquid27-v4/clear/preview_dark_wallpaper.png
            build/liquid27-v4/clear/preview_bright_wallpaper.png
            build/liquid27-v4/clear/preview_red_wallpaper.png
            build/liquid27-v4/clear/preview_cyan_wallpaper.png
            build/liquid27-v4/clear/preview_highcontrast_wallpaper.png
            build/liquid27-v4/clear/preview_refraction_stress.png
            build/liquid27-v4/clear/preview_container_only.png
            build/liquid27-v4/clear/preview_glyph_glass_only.png
            build/liquid27-v4/clear/preview_material_ab.png
            build/liquid27-v4/clear/preview_android_reality_check.png
            build/liquid27-v4/clear/preview_android_material_ab.png
            build/liquid27-v4/clear/preview_android_launcher_scale.png
            build/liquid27-v4/clear/preview_android_container_only.png
            build/liquid27-v4/clear/preview_android_glyph_only.png
            build/liquid27-v4/clear/preview_android_static_warm.png
            build/liquid27-v4/clear/preview_android_static_blue.png
            build/liquid27-v4/clear/preview_android_static_dark.png
            build/liquid27-v4/clear/preview_android_static_bright.png
            build/liquid27-v4/clear/preview_android_static_highcontrast.png
            build/liquid27-v4/clear/preview_optical_flow.png
            build/liquid27-v4/clear/preview_surface_normals.png
            build/liquid27-v4/clear/preview_fresnel_field.png
            build/liquid27-v4/clear/qa.tsv
          if-no-files-found: error
