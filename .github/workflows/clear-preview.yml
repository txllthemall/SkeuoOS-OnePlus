name: Clear v4.1 Preview

on:
  push:
    branches: [ v4.1-clear-glass ]
    paths:
      - 'tools/liquid27/clear_material.py'
      - 'tools/liquid27/glyphs_brand_curated.py'
      - 'tools/liquid27/glyphs_brand_fixes.py'
      - 'tools/liquid27/glyphs_brand_precision.py'
      - 'tools/liquid27/glyphs_vector_complete.py'
      - 'tools/liquid27/geometry_meta.py'
      - 'tools/generate_liquid27.py'
      - 'tools/generate_liquid27_release.py'
      - 'tools/preview_clear_v41.py'
      - '.github/workflows/clear-preview.yml'
  workflow_dispatch:

concurrency:
  group: clear-v41-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Render corrected-geometry Clear reference preview
        run: python3 tools/preview_clear_v41.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkeuoOS-Clear-v4.1-quick-preview
          path: build/clear-v41-quick/*.png
          if-no-files-found: error
